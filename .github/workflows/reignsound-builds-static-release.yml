name: Reignsound Builds — Static Production Release

on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "Type DEPLOY to authorize a production deployment from main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reignsound-org-production-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && inputs.release_confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact dispatched revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run Reignsound Builds static-site verification
        run: node scripts/verify-static-site.mjs

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && inputs.release_confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_obNNdOM8jvVdLORFbQgoPENu
      VERCEL_PROJECT_ID: prj_x9Bu984hxTP5WAaaoZrZzgOOn33x
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_CLI_VERSION:?Set production environment variable VERCEL_CLI_VERSION to a reviewed exact version}"
          test -n "${VERCEL_TOKEN:?Set VERCEL_TOKEN in the protected production environment}"

      - name: Check out the exact verified revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install reviewed Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Link the known Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Set footer verification date for this release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DATE="$(date -u +%F)" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "index.html";
            const html = readFileSync(path, "utf8");
            const date = process.env.RELEASE_DATE;
            const pattern = /<time id="release-verified-date" datetime="[^"]*">[^<]*<\/time>/;
            if (!pattern.test(html)) throw new Error("Footer verification-date element missing");
            writeFileSync(path, html.replace(pattern, `<time id="release-verified-date" datetime="${date}">${date}</time>`));
          '

      - name: Pull production project configuration
        run: vercel pull --yes --environment=production

      - name: Create production build
        run: vercel build --prod

      - name: Deploy the prebuilt output
        run: vercel deploy --prebuilt --prod --yes
